name: PR Check TypeScript

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/typescript/**"
      - "vitest.config.mts"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "eslint.config.mts"
      - ".github/workflows/pr-check-ts.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/typescript/**"
      - "vitest.config.mts"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "eslint.config.mts"
      - ".github/workflows/pr-check-ts.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint:fix

      - name: Typecheck
        run: pnpm typecheck

      # `emcmake` on the PATH: `build:wasm` then skips its Docker fallback,
      # which cannot mount the workspace as the runner user.
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.8
          actions-cache-folder: emsdk-cache

      # `wasm/mnbg-wasm.js` is generated, not tracked; `test:ts` exercises it
      # and `pnpm pack` publishes it.
      - name: Build the WebAssembly artifact
        run: pnpm run build:wasm

      - name: Test
        run: pnpm test:ts

      - name: Build
        run: pnpm build

      - name: Verify build output
        run: |
          test -f dist/index.js
          test -f types/index.d.ts
          test -f types/codegen/NativeMobileNativeBarcodeGenerator.ts

      - name: Verify the package contents
        run: pnpm pack --pack-destination "${RUNNER_TEMP}"

  codegen:
    name: React Native codegen
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the native interfaces
        run: pnpm codegen

      - name: Verify the generated artifacts
        run: |
          test -d android/generated
          test -d ios/generated
