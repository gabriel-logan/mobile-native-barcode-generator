buildscript {
  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.8.2"
    classpath "com.facebook.react:react-native-gradle-plugin"
  }
}

apply plugin: "com.android.library"
apply plugin: "com.facebook.react"

def getExtOrDefault(name, fallback) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
}

def getReactNativeVersion() {
  def reactNativeProperties = new Properties()
  rootProject.file("../node_modules/react-native/ReactAndroid/gradle.properties").withInputStream {
    reactNativeProperties.load(it)
  }
  return reactNativeProperties.getProperty("VERSION_NAME")
}

android {
  namespace "com.mobilenativebarcodegenerator"
  compileSdk getExtOrDefault("compileSdkVersion", 36)

  defaultConfig {
    minSdk getExtOrDefault("minSdkVersion", 24)
    targetSdk getExtOrDefault("targetSdkVersion", 36)
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  def reactNativeVersion = project == rootProject ? ":${getReactNativeVersion()}" : ""
  implementation "com.facebook.react:react-android${reactNativeVersion}"
}

react {
  jsRootDir = file("../types/codegen")
  libraryName = "RNMobileNativeBarcodeGeneratorSpec"
  codegenJavaPackageName = "com.mobilenativebarcodegenerator"
}
