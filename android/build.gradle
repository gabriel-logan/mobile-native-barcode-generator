buildscript {
  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.8.2"
  }
}

apply plugin: "com.android.library"
apply plugin: "com.facebook.react"

def getExtOrDefault(name, fallback) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
}

android {
  namespace "com.mobilenativebarcodegenerator"
  compileSdk getExtOrDefault("compileSdkVersion", 36)

  defaultConfig {
    minSdk getExtOrDefault("minSdkVersion", 24)
    targetSdk getExtOrDefault("targetSdkVersion", 36)
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  implementation "com.facebook.react:react-android"
}

react {
  jsRootDir = file("../src")
  libraryName = "RNMobileNativeBarcodeGeneratorSpec"
  codegenJavaPackageName = "com.mobilenativebarcodegenerator"
}
